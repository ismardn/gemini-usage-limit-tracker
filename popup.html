<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Quota</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .account-badge {
      font-size: 10px;
      padding: 1px 6px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-radius: 6px;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pct-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .status-green {
      background: rgba(16, 185, 129, 0.2);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-orange {
      background: rgba(245, 158, 11, 0.2);
      color: var(--orange);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-red {
      background: rgba(239, 68, 68, 0.2);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .progress-fill.status-green { background: var(--green); }
    .progress-fill.status-orange { background: var(--orange); }
    .progress-fill.status-red { background: var(--red); }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      background: var(--blue);
      color: #fff;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #2563eb;
    }

    .spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="#38bdf8"/>
      </svg>
      <span class="title">Gemini Quota</span>
    </div>
    <span class="account-badge" id="popup-acc">u/0</span>
  </div>

  <div class="card">
    <div class="card-title-row">
      <span class="card-title">Rolling Window (5 Hours)</span>
      <span class="pct-tag status-green" id="popup-cur-tag">--%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill status-green" id="popup-cur-fill"></div>
    </div>
    <div class="info-row">
      <span>Time remaining:</span>
      <strong id="popup-countdown">--</strong>
    </div>
    <div class="info-row">
      <span>Resets at:</span>
      <span id="popup-reset-clock">--</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title-row">
      <span class="card-title">Weekly Limit</span>
      <span class="pct-tag status-green" id="popup-week-tag">--%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill status-green" id="popup-week-fill"></div>
    </div>
    <div class="info-row">
      <span>Resets on:</span>
      <span id="popup-week-reset">--</span>
    </div>
  </div>

  <div class="actions">
    <button id="popup-refresh-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-1.19"/>
      </svg>
      <span>Refresh now</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
